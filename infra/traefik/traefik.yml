# План 08: дашборд по умолчанию выключен. `api.insecure: true` вместе с
# пробросом 8081 означал, что наружу торчит не только frontend и bff, но и
# сам ingress-контроллер — а инвариант спеки §3 именно про это.
# Для демонстрации дашборд включается оверлеем:
#   docker compose -f docker-compose.yml -f docker-compose.dashboard.yml up -d traefik
api:
  dashboard: false
  insecure: false

# Для healthcheck контейнера в docker-compose.yml (`traefik healthcheck --ping`).
# Слушает на служебном entryPoint `traefik` (:8080) ВНУТРИ контейнера —
# наружу этот порт больше не публикуется (см. docker-compose.yml).
ping: {}

entryPoints:
  web:
    address: ":80"

providers:
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

log:
  level: INFO
