api:
  dashboard: true
  insecure: true

# Для healthcheck контейнера в docker-compose.yml (`traefik healthcheck --ping`).
# Слушает на служебном entryPoint `traefik` (:8080), наружу он и так был открыт.
ping: {}

entryPoints:
  web:
    address: ":80"

providers:
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

log:
  level: INFO
