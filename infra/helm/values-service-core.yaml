replicaCount: 1

image:
  repository: localhost:5000/service-core
  tag: latest

service:
  port: 8080

# config.json содержит пароль БД (db_clients[].passwd), поэтому едет Secret'ом,
# а не ConfigMap (план 08).
config:
  enabled: true
  secret: true
  json:
    app:
      threads_num: 4
      log:
        log_level: INFO
    listeners:
      - address: "0.0.0.0"
        port: 8080
        https: false
    db_clients:
      - name: default
        rdbms: postgresql
        host: pg-core-postgresql.data.svc.cluster.local
        port: 5432
        dbname: core
        user: core
        # Пароль не литерал: подставляется из Secret релиза при рендере.
        # Обратные кавычки обязательны — см. комментарий к config.json в
        # values чарта (toPrettyJson экранировал бы двойные).
        passwd: "{{ required `secrets.data.dbPassword обязателен для service-core: передайте --set secrets.data.dbPassword=... (CD) или -f файлом вне git` .Values.secrets.data.dbPassword }}"
        is_fast: false
        connection_number: 8
    redis_clients:
      - name: default
        host: redis-master.data.svc.cluster.local
        port: 6379
        db: 0
        is_fast: false
        number_of_connections: 2

jwtKeys:
  private: false
  public: true
  publicFile: jwt_public.jwk
  mountPath: /etc/keys

env:
  - name: JWT_PUBLIC_KEY_PATH
    value: /etc/keys/jwt_public.jwk
  - name: COMMISSION_URL
    value: "http://service-commission.backend.svc.cluster.local:8000"
  - name: EMULATOR_ENABLED
    value: "true"
  - name: EMULATOR_SPEED
    value: "realistic"

migrations:
  enabled: true
  image: postgres:16
  db:
    host: pg-core-postgresql.data.svc.cluster.local
    port: "5432"
    name: core
    user: core
    passwordSecretKey: dbPassword

# Значения секретов в репозиторий не коммитятся — приезжают из CD
# (`--set secrets.data.dbPassword=...`) или файлом вне git. В compose пароль
# остаётся открытым намеренно (локальный стенд, README).
# Ключ объявлен пустым, а не отсутствует: имя ключа видно в файле (на него
# ссылаются config.json и migrations.db.passwordSecretKey), а забытый `--set`
# роняет рендер сообщением про пустое значение, а не про отсутствующий ключ.
secrets:
  enabled: true
  data:
    dbPassword: ""

# План 08 / спека §3: наружу service-core не публикуется — к нему ходит
# только BFF внутри кластера. Заодно это закрывает внутреннюю ручку
# эмулятора POST /internal/emulator/tick (спека §4.3): в k3s она не
# публикуется вообще, а NetworkPolicy ниже не пускает к ней никого,
# кроме bff.
ingress:
  enabled: false

cors:
  enabled: false

networkPolicy:
  enabled: true
  # ВНИМАНИЕ: под `bff` появляется в кластере только с values-bff.yaml
  # (Task 2 плана 08). До этого политика закрывает сервис для всех —
  # Task 1 нельзя выкатывать в k3s в одиночку.
  # Источник ищется в том же namespace (networkPolicy.namespace: "" в
  # values чарта) — bff обязан жить в `backend` вместе с сервисами.
  allowFrom:
    - app.kubernetes.io/name: bff

healthcheck:
  path: /health

# То же, что у service-auth: Drogon создаёт ./uploads/tmp/00 … FF
# относительно cwd (/app) при старте, и под read-only корнем это даёт 256
# строк ERROR на каждый рестарт. Сервис от этого не падает, но лог
# становится нечитаемым. Загрузок файлов в сервисе нет — emptyDir.
extraVolumes:
  - name: uploads
    emptyDir: {}
extraVolumeMounts:
  - name: uploads
    mountPath: /app/uploads
