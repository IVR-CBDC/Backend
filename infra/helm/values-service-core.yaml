replicaCount: 1

image:
  repository: localhost:5000/service-core
  tag: latest

service:
  port: 8080

config:
  enabled: true
  json:
    app:
      threads_num: 4
      log:
        log_level: INFO
    listeners:
      - address: "0.0.0.0"
        port: 8080
        https: false
    db_clients:
      - name: default
        rdbms: postgresql
        host: pg-core-postgresql.data.svc.cluster.local
        port: 5432
        dbname: core
        user: core
        passwd: core
        is_fast: false
        connection_number: 8
    redis_clients:
      - name: default
        host: redis-master.data.svc.cluster.local
        port: 6379
        db: 0
        is_fast: false
        number_of_connections: 2

jwtKeys:
  private: false
  public: true
  publicFile: jwt_public.jwk
  mountPath: /etc/keys

env:
  - name: JWT_PUBLIC_KEY_PATH
    value: /etc/keys/jwt_public.jwk
  - name: COMMISSION_URL
    value: "http://service-commission.backend.svc.cluster.local:8000"
  - name: EMULATOR_ENABLED
    value: "true"
  - name: EMULATOR_SPEED
    value: "realistic"

migrations:
  enabled: true
  image: postgres:16
  db:
    host: pg-core-postgresql.data.svc.cluster.local
    port: "5432"
    name: core
    user: core
    password: core

# План 08 / спека §3: наружу service-core не публикуется — к нему ходит
# только BFF внутри кластера. Заодно это закрывает внутреннюю ручку
# эмулятора POST /internal/emulator/tick (спека §4.3): в k3s она не
# публикуется вообще, а NetworkPolicy ниже не пускает к ней никого,
# кроме bff.
ingress:
  enabled: false

cors:
  enabled: false

networkPolicy:
  enabled: true
  allowFrom:
    - app.kubernetes.io/name: bff

healthcheck:
  path: /health
