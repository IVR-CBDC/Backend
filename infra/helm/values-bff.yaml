# BFF — единственная дверь из SPA в бэкенд (спека §3).
#
# Образ собирается и публикуется CI фронт-репозитория (alfa-cbdc-hub), здесь
# он только потребляется. Тег подставляет CD из infra/helm/frontend-tags.env
# (`--set image.tag=$BFF_IMAGE_TAG`) — `latest` ниже это заглушка, чтобы
# `helm template` рендерился без внешних аргументов, а не адрес выката.
replicaCount: 1

image:
  repository: ghcr.io/ivr-cbdc/frontend/bff
  tag: latest

service:
  port: 4000

config:
  enabled: false

jwtKeys:
  private: false
  public: false

# Проверка cookie-сессии живёт в самом BFF (JWT проверяет auth), ключи здесь
# не монтируются.
env:
  - name: PORT
    value: "4000"
  # Имена сервисов — те же релизы этого чарта в namespace backend.
  - name: AUTH_URL
    value: "http://service-auth.backend.svc.cluster.local:8080"
  - name: CORE_URL
    value: "http://service-core.backend.svc.cluster.local:8080"
  - name: COMMISSION_URL
    value: "http://service-commission.backend.svc.cluster.local:8000"
  # Redis из слоя данных (Makefile k3s-deploy-data, architecture=standalone —
  # отсюда имя сервиса redis-master), тот же адрес, что у service-core.
  - name: REDIS_URL
    value: "redis://redis-master.data.svc.cluster.local:6379"
  # Параметр, а не литерал (Global Constraints плана 08): CD обязан
  # переопределить список адресом стенда — `--set env[?].value` неудобен,
  # поэтому на практике это делается отдельным `-f` или --set-string по
  # индексу. Дефолт оставлен рабочим, а не пустым: BFF падает при старте с
  # пустым ALLOWED_ORIGINS (bff/src/config.ts), и молчаливый дефолт `*` здесь
  # был бы хуже неправильного localhost.
  - name: ALLOWED_ORIGINS
    value: "http://localhost,http://127.0.0.1"
  # Стенд ходит по http, cookie с Secure до браузера не доедет. За TLS —
  # `--set-string env[?].value=true`, а не правка этого файла.
  - name: COOKIE_SECURE
    value: "false"

migrations:
  enabled: false

secrets:
  enabled: false

# Наружу публикуется — это внешний периметр (спека §3).
# priority выше, чем у frontend: иначе `PathPrefix(`/`)` фронта перехватит
# /api и /ws. То же разделение, что в infra/traefik/dynamic.yml для compose.
ingress:
  enabled: true
  match: "PathPrefix(`/api`) || PathPrefix(`/ws`)"
  priority: 100

# CORS отдаёт сам BFF по своему ALLOWED_ORIGINS (bff/src/config.ts,
# checkOrigin). Middleware чарта здесь включать нельзя: два источника
# заголовка Access-Control-Allow-Origin на одном ответе дают дубль заголовка,
# и браузер отвергает такой ответ целиком.
cors:
  enabled: false

# NetworkPolicy у bff намеренно ВЫКЛЮЧЕНА, и это не забытый флаг.
#
# К bff ходит Traefik — под из другого namespace (у k3s это kube-system),
# и правило под него требует знать его метки и namespace в живом кластере.
# Здесь кластера нет; неверный podSelector не «чуть-чуть не тот» — он молча
# закрывает единственный вход в систему, и выглядит это как «стенд лёг».
# Плюс к bff ходит nginx фронта (frontend/nginx.conf проксирует /api и /ws
# на bff:4000), то есть источников как минимум два.
#
# Периметр bff закрыт снаружи Traefik'ом, а внутренний периметр — это
# политики auth/core/commission, которые пускают только bff. Включать это
# правило — задача первого выката на живой кластер: там надо посмотреть
# `kubectl get pod -n kube-system -l app.kubernetes.io/name=traefik --show-labels`
# и записать реальные метки.
networkPolicy:
  enabled: false

# Разделение ручек сделано в плане 05 и здесь именно используется:
#   /health — живость процесса, без единой сетевой проверки;
#   /ready  — готовность: Redis-подписка в моменте + auth/core/commission.
# Наоборот (liveness на /ready) недоступный auth перезапускал бы здоровый
# BFF по кругу — ровно то, ради чего ручки разделяли.
healthcheck:
  path: /health
  readinessPath: /ready
  initialDelaySeconds: 5
  periodSeconds: 10

# node:22-alpine содержит пользователя node с uid 1000 — под ним образ и
# собран (USER node в bff/Dockerfile). Пишем это явно: kubelet при
# runAsNonRoot должен видеть числовой uid.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
