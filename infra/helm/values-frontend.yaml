# SPA (nginx со статикой сборки).
#
# Образ собирается и публикуется CI фронт-репозитория (alfa-cbdc-hub), здесь
# он только потребляется. Тег подставляет CD из infra/helm/frontend-tags.env
# (`--set image.tag=$FRONTEND_IMAGE_TAG`) — `latest` ниже заглушка.
replicaCount: 1

image:
  repository: ghcr.io/ivr-cbdc/frontend/spa
  tag: latest

# 8080, НЕ 80. Образ — nginxinc/nginx-unprivileged (план 06): стоковый
# nginx:alpine слушает :80, а привязка к порту < 1024 требует root, под
# runAsNonRoot такой под не стартует вовсе.
service:
  port: 8080

config:
  enabled: false

jwtKeys:
  private: false
  public: false

env: []

migrations:
  enabled: false

secrets:
  enabled: false

# Наружу публикуется — внешний периметр (спека §3).
# Явно НИЗКИЙ приоритет: `PathPrefix(`/`)` матчит в том числе /api и /ws, и
# при сортировке по длине правила порядок держался бы на том, что правило
# bff длиннее. То же решение, что в infra/traefik/dynamic.yml для compose.
ingress:
  enabled: true
  match: "PathPrefix(`/`)"
  priority: 1

# Статика без cookie-запросов: CORS на этом маршруте не нужен.
cors:
  enabled: false

# NetworkPolicy выключена по той же причине, что у bff: единственный
# источник трафика — Traefik из другого namespace, и его метки без живого
# кластера неизвестны. См. комментарий в values-bff.yaml.
networkPolicy:
  enabled: false

# nginx не знает ничего о готовности бэкенда за ним — обе пробы проверяют
# ровно то, что он отдаёт SPA. Отдельного /ready у статики нет, поэтому
# readinessPath не задаётся (наследует path).
healthcheck:
  path: /
  initialDelaySeconds: 5
  periodSeconds: 10

# nginxinc/nginx-unprivileged работает под uid 101 (пользователь nginx).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  # ТОЧЕЧНОЕ исключение, единственное в пяти сервисах.
  #
  # nginx пишет в корневую ФС при каждом старте: кеши проксирования в
  # /var/cache/nginx (client_body, proxy, fastcgi, uwsgi, scgi — каталоги
  # создаются самим nginx), pid-файл в /tmp/nginx.pid, плюс штатный
  # docker-entrypoint.d прогоняет по /etc/nginx/conf.d свои скрипты
  # (10-listen-on-ipv6-on-ipv4.sh правит default.conf через sed -i). С
  # readOnlyRootFilesystem: true под не поднимется.
  #
  # Лечится это emptyDir-томами на /var/cache/nginx, /tmp и /etc/nginx/conf.d,
  # но проверить такой набор можно только на живом кластере — а выдуманный
  # список смонтированных каталогов хуже честного исключения. Поэтому здесь
  # выключено ЛОКАЛЬНО, у одного сервиса, а не в чарте: остальные четыре
  # остаются с readOnlyRootFilesystem: true.
  #
  # Остальные ограничения (runAsNonRoot, drop ALL, no privilege escalation)
  # у фронта в силе — именно ради них образ и перевели на 8080.
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL
