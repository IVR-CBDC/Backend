replicaCount: 1

image:
  repository: localhost:5000/service-auth
  tag: latest

service:
  port: 8080

config:
  enabled: true
  json:
    app:
      threads_num: 2
      log:
        log_level: INFO
    listeners:
      - address: "0.0.0.0"
        port: 8080
        https: false
    db_clients:
      - name: default
        rdbms: postgresql
        host: pg-auth-postgresql.data.svc.cluster.local
        port: 5432
        dbname: auth
        user: auth
        passwd: auth
        is_fast: false
        connection_number: 4

jwtKeys:
  private: true
  public: true
  publicFile: jwt_public.jwk
  mountPath: /etc/keys

env:
  - name: JWT_PRIVATE_KEY_PATH
    value: /etc/keys/jwt_private.jwk
  - name: JWT_PUBLIC_KEY_PATH
    value: /etc/keys/jwt_public.jwk

migrations:
  enabled: true
  image: postgres:16
  db:
    host: pg-auth-postgresql.data.svc.cluster.local
    port: "5432"
    name: auth
    user: auth
    password: auth

# План 08 / спека §3: наружу service-auth не публикуется — к нему ходит
# только BFF внутри кластера. IngressRoute и CORS-middleware здесь не
# нужны совсем (CORS — забота внешнего периметра, а он теперь у bff).
ingress:
  enabled: false

cors:
  enabled: false

networkPolicy:
  enabled: true
  allowFrom:
    - app.kubernetes.io/name: bff

healthcheck:
  path: /health
