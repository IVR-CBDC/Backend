replicaCount: 1

image:
  repository: localhost:5000/service-auth
  tag: latest

service:
  port: 8080

# config.json содержит пароль БД (db_clients[].passwd), поэтому едет Secret'ом,
# а не ConfigMap (план 08).
config:
  enabled: true
  secret: true
  json:
    app:
      threads_num: 2
      log:
        log_level: INFO
    listeners:
      - address: "0.0.0.0"
        port: 8080
        https: false
    db_clients:
      - name: default
        rdbms: postgresql
        host: pg-auth-postgresql.data.svc.cluster.local
        port: 5432
        dbname: auth
        user: auth
        # Пароль не литерал: подставляется из Secret релиза при рендере.
        # Обратные кавычки обязательны — см. комментарий к config.json в
        # values чарта (toPrettyJson экранировал бы двойные).
        passwd: "{{ required `secrets.data.dbPassword обязателен для service-auth: передайте --set secrets.data.dbPassword=... (CD) или -f файлом вне git` .Values.secrets.data.dbPassword }}"
        is_fast: false
        connection_number: 4

jwtKeys:
  private: true
  public: true
  publicFile: jwt_public.jwk
  mountPath: /etc/keys

env:
  - name: JWT_PRIVATE_KEY_PATH
    value: /etc/keys/jwt_private.jwk
  - name: JWT_PUBLIC_KEY_PATH
    value: /etc/keys/jwt_public.jwk

migrations:
  enabled: true
  image: postgres:16
  db:
    host: pg-auth-postgresql.data.svc.cluster.local
    port: "5432"
    name: auth
    user: auth
    passwordSecretKey: dbPassword

# Значения секретов в репозиторий не коммитятся: `secrets.data` наполняется
# из CD через `--set secrets.data.dbPassword=...` или файлом вне git. Здесь —
# только факт «у этого релиза есть Secret».
#
# В compose пароль остаётся открытым (`auth`) намеренно: это локальный стенд,
# решение записано в README. Secret — про k3s.
secrets:
  enabled: true
  data: {}

# План 08 / спека §3: наружу service-auth не публикуется — к нему ходит
# только BFF внутри кластера. IngressRoute и CORS-middleware здесь не
# нужны совсем (CORS — забота внешнего периметра, а он теперь у bff).
ingress:
  enabled: false

cors:
  enabled: false

networkPolicy:
  enabled: true
  # ВНИМАНИЕ: под `bff` появляется в кластере только с values-bff.yaml
  # (Task 2 плана 08). До этого политика закрывает сервис для всех —
  # Task 1 нельзя выкатывать в k3s в одиночку.
  # Источник ищется в том же namespace (networkPolicy.namespace: "" в
  # values чарта) — bff обязан жить в `backend` вместе с сервисами.
  allowFrom:
    - app.kubernetes.io/name: bff

healthcheck:
  path: /health
