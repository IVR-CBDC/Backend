replicaCount: 1

image:
  repository: localhost:5000/service-commission
  tag: latest

service:
  port: 8000

config:
  enabled: false

jwtKeys:
  private: false
  public: true
  publicFile: jwt_public.pem
  mountPath: /etc/keys

env:
  - name: JWT_PUBLIC_KEY_PATH
    value: /etc/keys/jwt_public.pem

# PG_DSN целиком уезжает в Secret: пароль здесь — часть строки подключения,
# и «вынести только пароль» нельзя, не собирая DSN внутри сервиса (а это код
# service-commission, не инфраструктура).
envSecret:
  - name: PG_DSN
    key: pgDsn

# Значения секретов в репозиторий не коммитятся. Снаружи передаётся ОДИН
# пароль:
#   --set secrets.data.dbPassword='<пароль>'
#
# DSN собирается здесь же из него. Двумя независимыми --set (отдельно
# dbPassword, отдельно готовый pgDsn с тем же паролем внутри) это разъехалось
# бы при первой ротации молча: сервис ходил бы со старым паролем, миграции с
# новым, и выглядело бы это как «БД отказывает через раз». Одна строчка
# правды — dbPassword.
#
# Шаблон в значении раскрывает secret.yaml через tpl; кавычки обратные —
# см. values чарта. В compose DSN остаётся открытым намеренно (локальный
# стенд, README).
secrets:
  enabled: true
  data:
    dbPassword: ""
    pgDsn: "postgresql+asyncpg://commission:{{ required `secrets.data.dbPassword обязателен для service-commission: из него собирается pgDsn` .Values.secrets.data.dbPassword }}@pg-commission-postgresql.data.svc.cluster.local:5432/commission"

migrations:
  enabled: true
  image: postgres:16
  db:
    host: pg-commission-postgresql.data.svc.cluster.local
    port: "5432"
    name: commission
    user: commission
    passwordSecretKey: dbPassword

# План 08 / спека §3: наружу не публикуется.
ingress:
  enabled: false

cors:
  enabled: false

networkPolicy:
  enabled: true
  # ВНИМАНИЕ: под `bff` появляется в кластере только с values-bff.yaml
  # (Task 2 плана 08). До этого политика закрывает сервис для всех —
  # Task 1 нельзя выкатывать в k3s в одиночку.
  # Источник ищется в том же namespace (networkPolicy.namespace: "" в
  # values чарта) — bff обязан жить в `backend` вместе с сервисами.
  allowFrom:
    # Единственное разрешённое межсервисное обращение по спеке §3:
    # service-core → service-commission при подтверждении сценария.
    - app.kubernetes.io/name: bff
    - app.kubernetes.io/name: service-core

healthcheck:
  path: /health
