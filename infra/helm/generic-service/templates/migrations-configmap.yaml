{{- if .Values.migrations.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "generic-service.fullname" . }}-migrations
  labels:
    {{- include "generic-service.labels" . | nindent 4 }}
data:
  migrate.sh: |
    {{- required "migrations.script обязателен — сгенерируйте values через infra/gen-migration-values.sh" .Values.migrations.script | nindent 4 }}
  {{- range $name, $content := .Values.migrations.files }}
  {{ $name }}: |
    {{- $content | nindent 4 }}
  {{- end }}
{{- end }}
