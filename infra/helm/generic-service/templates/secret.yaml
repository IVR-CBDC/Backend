{{/*
Секреты релиза (план 08, спека §8).

Два объекта, оба Secret:

  <release>-secrets  — пары ключ/значение из `secrets.data`: пароль БД,
                       готовый DSN и всё прочее, чему нельзя лежать в values
                       открытым текстом. Значения в репозиторий не
                       коммитятся, они приезжают из CD (`--set
                       secrets.data.<key>=...`) или из файла вне git.

  <release>-config   — config.json для сервисов, у которых он содержит
                       учётные данные (db_clients[].passwd у C++/Drogon).
                       Такой config.json не может ехать ConfigMap'ом: смысл
                       выносить пароль в Secret теряется, если тот же пароль
                       рядом лежит в ConfigMap.

В compose пароли остаются открытым текстом — это осознанное решение для
локального стенда (README). Здесь — k3s.
*/}}
{{- if .Values.secrets.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "generic-service.fullname" . }}-secrets
  labels:
    {{- include "generic-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if not .Values.secrets.data }}
  {{- fail "secrets.enabled=true, но secrets.data пуст: пустой Secret молча отдал бы сервису пустые значения. Передайте значения через --set secrets.data.<key>=... или файлом вне git." }}
  {{- end }}
  {{- range $key, $value := .Values.secrets.data }}
  {{- /* tpl: производные значения (DSN, в котором тот же пароль) собираются
         из других ключей здесь же, а не передаются вторым --set — два
         независимых --set с одним паролем внутри разъезжаются при ротации
         молча. */ -}}
  {{- $rendered := tpl ($value | toString) $ }}
  {{- if not $rendered }}
  {{- fail (printf "secrets.data.%s пуст: пустое значение в Secret — это не «не задано», а «сервис пошёл в БД с пустым паролем», и видно это только в рантайме. Задайте значение или уберите ключ." $key) }}
  {{- end }}
  {{ $key }}: {{ $rendered | quote }}
  {{- end }}
{{- end }}
{{- if and .Values.config.enabled .Values.config.secret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "generic-service.fullname" . }}-config
  labels:
    {{- include "generic-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  config.json: |
    {{- tpl (.Values.config.json | toPrettyJson) . | nindent 4 }}
{{- end }}
