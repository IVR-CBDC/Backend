{{/*
Секреты релиза (план 08, спека §8).

Два объекта, оба Secret:

  <release>-secrets  — пары ключ/значение из `secrets.data`: пароль БД,
                       готовый DSN и всё прочее, чему нельзя лежать в values
                       открытым текстом. Значения в репозиторий не
                       коммитятся, они приезжают из CD (`--set
                       secrets.data.<key>=...`) или из файла вне git.

  <release>-config   — config.json для сервисов, у которых он содержит
                       учётные данные (db_clients[].passwd у C++/Drogon).
                       Такой config.json не может ехать ConfigMap'ом: смысл
                       выносить пароль в Secret теряется, если тот же пароль
                       рядом лежит в ConfigMap.

В compose пароли остаются открытым текстом — это осознанное решение для
локального стенда (README). Здесь — k3s.
*/}}
{{- $data := .Values.secrets.data | default dict -}}
{{- $derived := .Values.secrets.derived | default dict -}}
{{- if .Values.secrets.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "generic-service.fullname" . }}-secrets
  labels:
    {{- include "generic-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if and (not $data) (not $derived) }}
  {{- fail "secrets.enabled=true, но secrets.data и secrets.derived пусты: пустой Secret молча отдал бы сервису пустые значения. Передайте значения через --set secrets.data.<key>=... или файлом вне git." }}
  {{- end }}
  {{- /* СЫРЫЕ значения. Никакого tpl: пароль — данные, а не шаблон.
         `{{` внутри пароля не должен ни ронять рендер, ни подставляться.

         toJson, а не quote: sprig quote оборачивает строку кавычками, но
         внутренние кавычки не экранирует, и пароль с `"` рвёт YAML
         («mapping values are not allowed in this context»). JSON — валидный
         YAML, и toJson экранирует всё, что нужно. */ -}}
  {{- range $key, $value := $data }}
  {{- include "generic-service.checkSecretKey" (dict "key" $key "where" "secrets.data") }}
  {{- $v := $value | toString }}
  {{- if not $v }}
  {{- fail (printf "secrets.data.%s пуст: пустое значение в Secret — это не «не задано», а «сервис пошёл в БД с пустым паролем», и видно это только в рантайме. Задайте значение или уберите ключ." $key) }}
  {{- end }}
  {{ $key }}: {{ $v | toJson }}
  {{- end }}
  {{- /* ВЫВОДИМЫЕ значения: шаблон написан в репозитории, не пользователем. */ -}}
  {{- range $key, $value := $derived }}
  {{- include "generic-service.checkSecretKey" (dict "key" $key "where" "secrets.derived") }}
  {{- if hasKey $data $key }}
  {{- fail (printf "ключ %q объявлен и в secrets.data, и в secrets.derived: из values не видно, какое из двух значений окажется в Secret'е. Оставьте одно." $key) }}
  {{- end }}
  {{- $v := tpl ($value | toString) $ }}
  {{- if not $v }}
  {{- fail (printf "secrets.derived.%s отрендерился пустым: проверьте, что все ключи, из которых он собирается, заданы." $key) }}
  {{- end }}
  {{ $key }}: {{ $v | toJson }}
  {{- end }}
{{- end }}
{{- if and .Values.config.enabled .Values.config.secret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "generic-service.fullname" . }}-config
  labels:
    {{- include "generic-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  config.json: |
    {{- tpl (.Values.config.json | toPrettyJson) . | nindent 4 }}
{{- end }}
