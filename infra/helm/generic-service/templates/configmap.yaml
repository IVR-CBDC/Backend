{{/*
config.json без учётных данных. Если в нём есть пароль (config.secret: true),
он рендерится Secret'ом — см. templates/secret.yaml.
*/}}
{{- if and .Values.config.enabled (not .Values.config.secret) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "generic-service.fullname" . }}-config
  labels:
    {{- include "generic-service.labels" . | nindent 4 }}
data:
  config.json: |
    {{- .Values.config.json | toPrettyJson | nindent 4 }}
{{- end }}
