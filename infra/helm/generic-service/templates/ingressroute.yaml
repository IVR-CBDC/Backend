{{- if .Values.ingress.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "generic-service.fullname" . }}
  labels:
    {{- include "generic-service.labels" . | nindent 4 }}
spec:
  entryPoints:
    - web
  routes:
    - match: {{ required "ingress.enabled=true требует непустой ingress.match: маршрут без правила Traefik молча не создаст." .Values.ingress.match }}
      kind: Rule
      {{- if .Values.ingress.priority }}
      # Явный приоритет: дефолтная сортировка Traefik по длине правила
      # отдала бы /api фронту, стоит правилу bff стать короче.
      priority: {{ .Values.ingress.priority }}
      {{- end }}
      services:
        - name: {{ include "generic-service.fullname" . }}
          namespace: {{ .Release.Namespace }}
          port: {{ .Values.service.port }}
      {{- if .Values.cors.enabled }}
      middlewares:
        - name: {{ include "generic-service.fullname" . }}-cors
      {{- end }}
{{- end }}
