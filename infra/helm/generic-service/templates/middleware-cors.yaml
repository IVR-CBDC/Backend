{{- if .Values.cors.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "generic-service.fullname" . }}-cors
  labels:
    {{- include "generic-service.labels" . | nindent 4 }}
spec:
  headers:
    accessControlAllowOriginList:
      {{- if not .Values.cors.allowOrigins }}
      {{- fail "cors.enabled=true требует непустой cors.allowOrigins: звёздочка и пустой список запрещены (спека §3.1, сессия в cookie)" }}
      {{- end }}
      {{- range (splitList "," .Values.cors.allowOrigins) }}
      - {{ . | trim | quote }}
      {{- end }}
    accessControlAllowMethods:
      {{- range (splitList "," .Values.cors.allowMethods) }}
      - {{ . | trim | quote }}
      {{- end }}
    accessControlAllowHeaders:
      {{- range (splitList "," .Values.cors.allowHeaders) }}
      - {{ . | trim | quote }}
      {{- end }}
    accessControlAllowCredentials: {{ .Values.cors.allowCredentials }}
    accessControlMaxAge: {{ .Values.cors.maxAge }}
{{- end }}
