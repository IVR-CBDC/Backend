replicaCount: 1

image:
  repository: localhost:5000/service
  tag: latest
  pullPolicy: Always

imagePullSecrets: []

service:
  port: 8080

env: []

# Переменные окружения, значение которых — ключ в Secret этого релиза
# (`<release>-secrets`, см. `secrets` ниже). Сюда идёт всё, что не должно
# лежать в values открытым текстом: пароль БД, готовый DSN и т.п.
#
#   envSecret:
#     - name: PG_DSN
#       key: pgDsn
#
# `name` — имя переменной в контейнере, `key` — ключ в `secrets.data`.
# Ключ обязан существовать в `secrets.data`, иначе рендер падает: kubelet на
# несуществующий ключ отвечает CreateContainerConfigError, и ловится это
# только выкатом.
envSecret: []

# Переменные окружения в виде map: имя → значение. То же, что `env`, но
# адресуемое по имени, а не по индексу списка.
#
# Это не дубль ради удобства. `--set env[5].value=...` привязан к позиции в
# массиве: вставка любой переменной выше по списку молча переназначит другую —
# для ALLOWED_ORIGINS это означает тихо разрешённый чужой origin, который
# видно только из браузера. `--set envMap.ALLOWED_ORIGINS=...` к порядку не
# чувствителен.
#
# Запятые в значении экранируются (`--set` режет по ним):
#   --set-string envMap.ALLOWED_ORIGINS='http://a\,http://b'
#
# Значения квотируются при рендере: env в Kubernetes — всегда строка, и
# `--set envMap.COOKIE_SECURE=false` без quote отрендерился бы YAML-булевым
# и был бы отвергнут API-сервером.
envMap: {}

# Дополнительные тома и их монтирование — для каталогов, в которые процесс
# обязан писать при readOnlyRootFilesystem: true (emptyDir), и только для
# них. Постоянного состояния у сервисов платформы нет.
extraVolumes: []
extraVolumeMounts: []

config:
  enabled: false
  # config.json содержит учётные данные (в db_clients у C++-сервисов лежит
  # `passwd`), поэтому для таких сервисов он обязан ехать Secret'ом, а не
  # ConfigMap: ConfigMap отдаётся любому, у кого есть `get configmaps` в
  # namespace, и попадает в `kubectl describe` целиком.
  secret: false
  # Значения config.json прогоняются через `tpl`, то есть могут ссылаться на
  # другие values. Ровно для этого: пароль в values не пишется литералом, а
  # подставляется из секрета —
  #   passwd: "{{ required `...` .Values.secrets.data.dbPassword }}"
  # Кавычки внутри шаблона ОБЯЗАНЫ быть обратными: config.json сериализуется
  # через toPrettyJson до tpl, и двойные кавычки приехали бы в шаблон
  # экранированными (\"), на чём Go-шаблонизатор падает.
  json: {}

# Secret релиза (`<release>-secrets`). Значения в репозиторий не коммитятся:
# они приезжают из CD через `--set secrets.data.<key>=...` или из внешнего
# файла (`-f secrets-local.yaml`), который лежит вне git.
#
# В compose пароли остаются открытым текстом — это осознанное решение для
# локального стенда (см. README, раздел про секреты). Этот Secret — про k3s.
secrets:
  enabled: false
  # СЫРЫЕ значения. Через `tpl` НЕ прогоняются и прогоняться не должны:
  # пароль — это данные пользователя, а не шаблон. Пароль, содержащий `{{`,
  # ронял бы рендер (`cannot parse template`), а если бы `{{…}}` оказалось
  # валидным шаблоном — подставился бы молча и по-разному в разных местах,
  # потому что tpl отрабатывает одним проходом, а config.json берёт значение
  # до него. Разъезд пароля между сервисом и миграциями — ровно то, что
  # секрет обязан исключать.
  #
  # Пустое значение у объявленного ключа роняет рендер: пустой пароль в
  # Secret'е — это не «секрет не задан», а «сервис ушёл в БД с пустым
  # паролем», и обнаруживается это уже в рантайме.
  data: {}
  # ВЫВОДИМЫЕ значения: шаблоны, которые собираются из `secrets.data` и
  # ложатся в тот же Secret. Шаблонизируется только то, что написано в
  # репозитории, — пользовательские данные сюда не попадают.
  #
  # Зачем: у service-commission DSN содержит тот же пароль, что dbPassword.
  # Двумя независимыми `--set` (отдельно пароль, отдельно готовый DSN) это
  # разъехалось бы при первой ротации молча. Здесь снаружи передаётся один
  # пароль, а DSN выводится из него:
  #
  #   derived:
  #     pgDsn: "postgresql+asyncpg://user:{{ .Values.secrets.data.dbPassword }}@host/db"
  #
  # Кавычки внутри шаблона — обратные (см. config.json выше).
  # Ключ, объявленный и в data, и в derived, роняет рендер: какое из двух
  # значений победило бы, из values не видно.
  derived: {}

jwtKeys:
  private: false
  public: false
  publicFile: jwt_public.jwk
  mountPath: /etc/keys

migrations:
  enabled: false
  image: postgres:16
  script: ""
  files: {}
  db:
    host: ""
    port: "5432"
    name: ""
    user: ""
    # Пароль init-контейнера миграций приходит из того же Secret, что и
    # пароль самого сервиса (`<release>-secrets`), — здесь только имя ключа.
    # Открытым текстом пароль в values не хранится (план 08).
    #
    # Пусто при migrations.enabled=true = ошибка рендера: иначе init-контейнер
    # ушёл бы в psql с пустым DB_PASSWORD, а секрет был бы наполовину
    # бесполезен — сервис по секрету, миграции литералом.
    passwordSecretKey: ""

# Наружу (IngressRoute) публикуются только bff и frontend — спека §3.
# Дефолт выключен намеренно: сервис торчит наружу, только если его values
# это сказали явно.
ingress:
  enabled: false
  match: ""
  # Приоритет маршрута Traefik. По умолчанию Traefik сортирует маршруты по
  # длине правила, и `PathPrefix(`/`)` фронта при таком раскладе живёт лишь
  # потому, что его правило короче. Полагаться на это нельзя: у frontend
  # стоит явно низкий priority, у bff — высокий (так же, как в
  # infra/traefik/dynamic.yml для compose). 0 = не задавать.
  priority: 0

cors:
  enabled: false
  # Никакой звёздочки: сессия живёт в HttpOnly-cookie (спека §3.1), а
  # `*` вместе с credentials — плохая пара. Values сервиса, который
  # включает cors, обязаны задать реальный список источников.
  allowOrigins: ""
  allowMethods: "GET,POST,PUT,DELETE,OPTIONS"
  allowHeaders: "Authorization,Content-Type"
  allowCredentials: true
  maxAge: 600

networkPolicy:
  enabled: false
  # Список подов-источников, которым разрешён вход. Элемент — matchLabels
  # пода-источника; чарт метит поды `app.kubernetes.io/name: <release>`,
  # поэтому источник записывается так:
  #   allowFrom:
  #     - app.kubernetes.io/name: bff
  # Пустой список = deny all (fail closed — это дефолт для сервиса,
  # который не объявил вызывающих). Пустой ЭЛЕМЕНТ списка (`- {}`) роняет
  # рендер: podSelector с пустым matchLabels открыл бы весь namespace.
  #
  # ВНИМАНИЕ (связка задач плана 08): пока в кластере нет пода `bff`
  # (values-bff.yaml — Task 2), эта политика закрывает auth/core для всех.
  # Task 1 нельзя выкатывать в k3s в одиночку — только вместе с Task 2.
  allowFrom: []
  # Namespace, в котором ищутся поды из allowFrom. Пусто — тот же
  # namespace, что и у самого сервиса (podSelector без namespaceSelector).
  #
  # Это ТРЕБОВАНИЕ, а не случайность: при пустом значении под-источник
  # обязан жить в том же namespace, что и сервис (`backend`). Если bff
  # когда-нибудь уедет в другой namespace, здесь придётся проставить его
  # имя — иначе политика молча закроет трафик, и выглядеть это будет как
  # «BFF не видит auth».
  namespace: ""
  # Подсети, которым разрешён вход помимо allowFrom. Сюда вписывается
  # podCIDR / подсеть узлов кластера, если kubelet ходит в под с адреса
  # узла: такой трафик идёт с host-сети и не попадает ни под какой
  # namespaceSelector, поэтому правилом `kube-system` он не лечится
  # (его здесь сознательно нет — оно пустило бы к сервису ещё и Traefik,
  # CoreDNS и metrics-server).
  #
  # По умолчанию пусто: без живого кластера подсеть неизвестна, а
  # выдуманный CIDR был бы хуже пустого. ЭТО ПЕРВОЕ, ЧТО НАДО ПРОВЕРИТЬ
  # НА ЖИВОМ КЛАСТЕРЕ: если поды встают Unhealthy после применения
  # политики — значит пробы режутся здесь, и сюда идёт подсеть узлов.
  allowFromCIDRs: []

# securityContext пода. runAsUser задаётся ЯВНО и не может быть пустым при
# runAsNonRoot: образы service-auth и service-core не объявляют USER
# (debian:bookworm-slim, см. их Dockerfile), а service-commission объявляет
# нечисловой `USER app` — в обоих случаях kubelet не может доказать, что
# пользователь не root, и отказывается стартовать контейнер
# («container has runAsNonRoot and image will run as root» /
# «...has non-numeric user»). Дефолт 65532 — общепринятый nonroot-uid; сервис
# вправе переопределить его своим (у фронта — 101, пользователь nginx).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# securityContext контейнера.
securityContext:
  allowPrivilegeEscalation: false
  # Дефолт — true. Выключается ТОЧЕЧНО, в values конкретного сервиса, с
  # причиной: глобальное выключение сняло бы защиту и с тех четырёх, кому
  # она ничего не стоит.
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

healthcheck:
  path: /health
  # Путь readinessProbe. Пусто = тот же, что у liveness.
  #
  # Это разделение не косметика: у BFF (план 05) `/health` — живость
  # процесса без единой сетевой проверки, а `/ready` — настоящая готовность
  # (Redis-подписка в моменте + доступность auth/core/commission). Если
  # повесить livenessProbe на `/ready`, недоступный апстрим начнёт
  # перезапускать здоровый под — ровно то, ради чего ручки и разделяли.
  readinessPath: ""
  initialDelaySeconds: 5
  periodSeconds: 10
