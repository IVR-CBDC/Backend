# Оверлей детерминированного эмулятора. Ровно один параметр — и это
# намеренно.
#
# ЗАЧЕМ ОН ЕСТЬ. До плана 08 `EMULATOR_MANUAL=true` был не свойством стенда,
# а префиксом команды: он жил в env вызывающего (`EMULATOR_MANUAL=true
# docker compose ... up`) и в теле цели `make e2e-stand-up`. Разница
# принципиальная. `environment` в compose — это желаемое состояние
# контейнера: при каждом `up` того же проекта compose пересчитывает его для
# ВСЕХ сервисов дефолтного набора, а не только для названных на команде.
# Значит достаточно один раз выполнить `docker compose ... up -d bff` без
# префикса — и service-core будет пересоздан со значением по умолчанию
# (`EMULATOR_MANUAL: "${EMULATOR_MANUAL:-false}"`, см. docker-compose.yml),
# то есть с живым фоновым эмулятором. Идущие в этот момент e2e не падают —
# они начинают тихо терять детерминированность. За план 07 на эту ловушку
# наступили дважды.
#
# Когда режим задан файлом, забыть его нельзя: он либо в списке `-f`, либо
# нет, и это видно в самой команде. `docker compose -f docker-compose.yml -f
# docker-compose.e2e.yml up ...` идемпотентен — Makefile, CI фронта и
# человек руками сходятся к одному и тому же состоянию.
#
# ПОЧЕМУ ЗДЕСЬ ТОЛЬКО ОДИН КЛЮЧ. `environment`, заданный мэппингом,
# compose СЛИВАЕТ по ключам, а не заменяет целиком (проверено:
# `docker compose -f a.yml -f b.yml config` оставляет ключи базы, которых
# нет в оверлее). Поэтому остальные переменные service-core — DB_HOST,
# REDIS_HOST, EMULATOR_SPEED и прочие — сюда переносить не нужно и вредно:
# копия разъедется с оригиналом.
#
# ОБРАТНАЯ СТОРОНА, КОТОРАЯ И ЕСТЬ ЛЕЧЕНИЕ ЛОВУШКИ: обычный `make up` (без
# этого файла) пересчитает service-core уже без EMULATOR_MANUAL и вернёт
# его в автоматический режим сам — пересоздав контейнер, потому что
# изменился его конфиг. Раньше для этого требовалась команда из README,
# которую надо было вспомнить.
#
# Использование:
#   make e2e-stand-up      # эта же тройка файлов
#   make test-api          # то же (api-тесты тоже требуют ручного режима)
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml \
#     -f docker-compose.e2e.yml up -d --wait service-core
#
# В k3s этот оверлей не используется: ручной режим эмулятора — свойство
# тестового compose-стенда, а не деплоя (спека §4.3).

services:
  service-core:
    environment:
      EMULATOR_MANUAL: "true"
