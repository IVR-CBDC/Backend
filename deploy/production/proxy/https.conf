map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
    listen 8081;
    access_log off;
    location = /health { return 200 "ok\n"; }
    location / { return 404; }
}
server {
    listen 8080 default_server;
    server_name alfacbcd.ru;
    access_log off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 308 https://alfacbcd.ru$request_uri; }
}
server {
    listen 8443 ssl;
    server_name alfacbcd.ru;
    ssl_certificate /etc/letsencrypt/live/alfacbcd.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alfacbcd.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    server_tokens off;
    # Avoid storing tokens or user information from request URLs in access logs.
    access_log off;
    client_max_body_size 10m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $bff http://bff:4000;
    set $spa http://frontend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    location /api/ { proxy_pass $bff; }
    location /ws {
        proxy_pass $bff;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
    location / { proxy_pass $spa; }
}
