name: ivr

networks:
  backend-net:
    driver: bridge

volumes:
  pg_auth_data:
  pg_core_data:
  pg_commission_data:

services:
  # ============================================================
  # Общий базовый образ для C++/Drogon-сервисов (см. infra/docker/cpp-base.Dockerfile)
  # ============================================================
  cpp-base:
    profiles: [build]
    image: ivr-cpp-base:latest
    build:
      context: infra/docker
      dockerfile: cpp-base.Dockerfile
    command: ["true"]
    networks: [backend-net]

  # ============================================================
  # Ingress
  # ============================================================
  # План 08: наружу через Traefik публикуются только frontend (`/`) и bff
  # (`/api`, `/ws`) — см. infra/traefik/dynamic.yml и спеку §3. Прямых
  # маршрутов к auth/core/commission больше нет.
  #
  # bff и frontend живут под профилями (ниже) и обычным `make up` не
  # поднимаются. Traefik от этого не падает: file-провайдер загружает
  # роутеры и сервисы независимо от доступности бэкенда, недоступный
  # upstream даёт 502 на запрос, а не ошибку старта (проверено локально,
  # см. отчёт task-1 плана 08).
  traefik:
    image: traefik:v2.10
    command:
      - --configFile=/etc/traefik/traefik.yml
    environment:
      # Список источников для CORS-middleware. dynamic.yml — Go-шаблон
      # file-провайдера, он читает эту переменную. Звёздочка запрещена
      # (сессия в cookie, спека §3.1); дефолт — адреса локального стенда.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1,http://127.0.0.1:8090,http://localhost:5173}
    ports:
      - "80:80"
      - "8081:8080"
    volumes:
      - ./infra/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./infra/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    healthcheck:
      # ping-энтрипоинт включён в infra/traefik/traefik.yml; `traefik
      # healthcheck` ходит в него внутри контейнера.
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [backend-net]

  # ============================================================
  # Postgres (один на сервис)
  # ============================================================
  pg-auth:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
      POSTGRES_DB: auth
    volumes:
      - pg_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth"]
      interval: 2s
      retries: 20
    networks: [backend-net]

  pg-core:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: core
      POSTGRES_PASSWORD: core
      POSTGRES_DB: core
    volumes:
      - pg_core_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core"]
      interval: 2s
      retries: 20
    networks: [backend-net]

  pg-commission:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: commission
      POSTGRES_PASSWORD: commission
      POSTGRES_DB: commission
    volumes:
      - pg_commission_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commission"]
      interval: 2s
      retries: 20
    networks: [backend-net]

  # ============================================================
  # Общий Redis (с префиксами на стороне приложений)
  # ============================================================
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 20
    networks: [backend-net]

  # ============================================================
  # Миграции (init-контейнеры)
  # ============================================================
  migrate-auth:
    image: postgres:16-alpine
    entrypoint: ["/bin/sh", "/app/migrate.sh"]
    volumes:
      - ./infra/migrate.sh:/app/migrate.sh:ro
      - ./services/service-auth/migrations:/app/migrations:ro
    environment:
      DB_HOST: pg-auth
      DB_PORT: "5432"
      DB_NAME: auth
      DB_USER: auth
      DB_PASSWORD: auth
    depends_on:
      pg-auth: { condition: service_healthy }
    networks: [backend-net]

  migrate-core:
    image: postgres:16-alpine
    entrypoint: ["/bin/sh", "/app/migrate.sh"]
    volumes:
      - ./infra/migrate.sh:/app/migrate.sh:ro
      - ./services/service-core/migrations:/app/migrations:ro
    environment:
      DB_HOST: pg-core
      DB_PORT: "5432"
      DB_NAME: core
      DB_USER: core
      DB_PASSWORD: core
    depends_on:
      pg-core: { condition: service_healthy }
    networks: [backend-net]

  migrate-commission:
    image: postgres:16-alpine
    entrypoint: ["/bin/sh", "/app/migrate.sh"]
    volumes:
      - ./infra/migrate.sh:/app/migrate.sh:ro
      - ./services/service-commission/migrations:/app/migrations:ro
    environment:
      DB_HOST: pg-commission
      DB_PORT: "5432"
      DB_NAME: commission
      DB_USER: commission
      DB_PASSWORD: commission
    depends_on:
      pg-commission: { condition: service_healthy }
    networks: [backend-net]

  # ============================================================
  # Сервисы
  # ============================================================
  service-auth:
    build:
      context: .
      dockerfile: services/service-auth/Dockerfile
    environment:
      DB_HOST: pg-auth
      DB_PORT: "5432"
      DB_NAME: auth
      DB_USER: auth
      DB_PASSWORD: auth
      SERVICE_PORT: "8080"
      JWT_PRIVATE_KEY_PATH: /etc/keys/jwt_private.jwk
      JWT_PUBLIC_KEY_PATH: /etc/keys/jwt_public.jwk
    volumes:
      - ./infra/keys:/etc/keys:ro
    depends_on:
      migrate-auth: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      # /health всегда отвечает 200 (см. health.cc): статус — в теле, ok=false
      # при недоступном Postgres, поэтому проверяем не только код ответа.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health | grep -q '\"ok\":true' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [backend-net]

  service-core:
    build:
      context: .
      dockerfile: services/service-core/Dockerfile
    environment:
      DB_HOST: pg-core
      DB_PORT: "5432"
      DB_NAME: core
      DB_USER: core
      DB_PASSWORD: core
      SERVICE_PORT: "8080"
      JWT_PUBLIC_KEY_PATH: /etc/keys/jwt_public.jwk
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      COMMISSION_URL: "http://service-commission:8000"
      EMULATOR_ENABLED: "true"
      EMULATOR_SPEED: demo
      EMULATOR_MANUAL: "${EMULATOR_MANUAL:-false}"
    volumes:
      - ./infra/keys/jwt_public.jwk:/etc/keys/jwt_public.jwk:ro
    depends_on:
      migrate-core: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      # core's /health тоже всегда 200 — Postgres/Redis отражены в теле как
      # postgres_ok/redis_ok/ok, поэтому проверяем ok:true, а не только код.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health | grep -q '\"ok\":true' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [backend-net]

  service-commission:
    build:
      context: .
      dockerfile: services/service-commission/Dockerfile
    environment:
      PG_DSN: "postgresql+asyncpg://commission:commission@pg-commission:5432/commission"
      JWT_PUBLIC_KEY_PATH: /etc/keys/jwt_public.pem
    volumes:
      - ./infra/keys/jwt_public.pem:/etc/keys/jwt_public.pem:ro
    depends_on:
      migrate-commission: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      retries: 20
    networks: [backend-net]

  # ============================================================
  # BFF (план 05, Frontend-репозиторий) — единственная дверь для SPA.
  # F1 (final review): образ по умолчанию — не наш образ. По спеке §9 CI
  # Frontend-репозитория собирает и публикует
  # ghcr.io/ivr-cbdc/frontend/bff (тег приезжает в
  # infra/helm/frontend-tags.env), а не ghcr.io/ivr-cbdc/backend/bff —
  # namespace ниже поправлен под это. Но CI Frontend-репозитория этот
  # образ пока ни разу не публиковал (см. README) — с текущим тегом его
  # нельзя ни собрать (Backend-репозиторий не содержит исходники bff), ни
  # стянуть. `make up` раньше запускал `docker compose up --build -d` без
  # списка сервисов и поэтому на каждом свежем клоне пытался тянуть
  # несуществующий образ и падал. `profiles: [bff]` исключает bff из
  # такого «поднять всё» по умолчанию — сервис по-прежнему поднимается,
  # если его назвать явно (`docker compose ... up -d --wait bff`, как
  # делают README/Step 3 плана 05): именование сервиса на команде
  # обходит profiles независимо от того, активирован ли профиль — это
  # задокументированное поведение docker compose, проверено локально
  # (см. отчёт). Для локальной сборки из ../alfa-cbdc-hub по-прежнему
  # нужен docker-compose.override.yml.example — он не изменился.
  # Traefik сюда пока не смотрит — внешняя маршрутизация BFF это план 08.
  # ============================================================
  bff:
    image: ${BFF_IMAGE:-ghcr.io/ivr-cbdc/frontend/bff:latest}
    profiles: ["bff"]
    environment:
      PORT: "4000"
      AUTH_URL: http://service-auth:8080
      CORE_URL: http://service-core:8080
      COMMISSION_URL: http://service-commission:8000
      REDIS_URL: redis://redis:6379
      # F12 (final review): параметризовано, чтобы план 08 (Traefik перед
      # SPA) не правил этот файл, а задавал свой список origin'ов через
      # переменную окружения — этот дефолт остаётся рабочим для локального
      # стенда без Traefik.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost}
      COOKIE_SECURE: "false"
    depends_on:
      service-auth: { condition: service_healthy }
      service-core: { condition: service_healthy }
      service-commission: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      # F10 (final review): /health — только живость процесса (без сети),
      # готовность (Redis-подписка в моменте + auth/core/commission) теперь
      # отдельная ручка /ready — её и должен проверять compose/k3s
      # readinessProbe (план 08), а не /health. Тело в том же виде,
      # что у auth/core ({ok, ...}), поэтому грепаем "ok":true так же, как
      # их healthcheck выше.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/ready | grep -q '\"ok\":true' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [backend-net]

  # ============================================================
  # Frontend SPA (план 06, Frontend-репозиторий) — nginx со статикой,
  # проксирующий /api и /ws на bff. Тот же паттерн, что у bff выше: образ
  # ghcr.io/ivr-cbdc/frontend/spa CI Frontend-репозитория пока не
  # публиковал, поэтому сервис под своим профилем — обычный `make up` его
  # не трогает и не пытается тянуть несуществующий образ. Для локальной
  # сборки из ../alfa-cbdc-hub — свой блок в
  # docker-compose.override.yml.example (frontend/Dockerfile). Traefik
  # сюда пока не смотрит — внешняя маршрутизация это план 08.
  # ============================================================
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/ivr-cbdc/frontend/spa:latest}
    profiles: ["frontend"]
    depends_on:
      bff: { condition: service_healthy }
    healthcheck:
      # nginx сам ничего не знает о готовности бэкенда за ним — проверяем
      # только то, что nginx реально отдаёт SPA (страница на "/"), как и
      # положено liveness/readiness-проверке статического сервера.
      #
      # F11 (final review): образ SPA перешёл на nginxinc/nginx-unprivileged
      # (Frontend-репозиторий, frontend/Dockerfile) — он слушает 8080, а не
      # 80 (привязка к :80 требует root, под restricted/runAsNonRoot под не
      # стартует).
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ | grep -qi '<html' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [backend-net]
