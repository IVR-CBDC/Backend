name: Production

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [frontend-images]

permissions:
  contents: read

# Frontend dispatches are handled here too: one queue across both repositories.
concurrency:
  group: ivrcbdc-production
  cancel-in-progress: false
  queue: max

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      backend_sha: ${{ steps.refs.outputs.backend_sha }}
      frontend_sha: ${{ steps.refs.outputs.frontend_sha }}
      matrix: ${{ steps.plan.outputs.matrix }}
      base_image: ${{ steps.plan.outputs.base_image }}
      base_needed: ${{ steps.plan.outputs.base_needed }}
      build_needed: ${{ steps.plan.outputs.build_needed }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release isolation and recovery
        env:
          INITIALIZE_PRODUCTION: ${{ vars.INITIALIZE_PRODUCTION }}
        run: |
          python3 deploy/production/tests/check.py
          python3 deploy/production/tests/ssh-check.py
          python3 deploy/production/tests/plan-check.py
          if [[ "$INITIALIZE_PRODUCTION" == true ]]; then
            docker pull postgres:16-alpine
            docker pull redis:7-alpine
            python3 deploy/production/tests/bootstrap-check.py
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: refs
        run: |
          set -euo pipefail
          backend_sha=$(git rev-parse HEAD)
          frontend_sha=$(git ls-remote https://github.com/IVR-CBDC/Frontend.git refs/heads/main | cut -f1)
          [[ "$frontend_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "backend_sha=$backend_sha" >> "$GITHUB_OUTPUT"
          echo "frontend_sha=$frontend_sha" >> "$GITHUB_OUTPUT"
      - id: plan
        run: python3 deploy/production/scripts/plan.py --output image-plan.json
      - uses: actions/upload-artifact@v4
        with:
          name: image-plan
          path: image-plan.json
          retention-days: 7

  preflight:
    needs: plan
    runs-on: ubuntu-latest
    environment: production
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - name: Initialize application schema and secrets once in existing services
        if: vars.INITIALIZE_PRODUCTION == 'true'
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ vars.PROD_SSH_PORT || '22' }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: bash deploy/production/ci/ssh-bootstrap.sh
      - id: check
        name: Configure registry access and check VPS readiness (no deployment)
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ vars.PROD_SSH_PORT || '22' }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
        run: bash deploy/production/ci/preflight.sh

  cpp-base:
    needs: plan
    if: needs.plan.outputs.base_needed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: infra/docker
          file: infra/docker/cpp-base.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ needs.plan.outputs.base_image }}
          labels: org.opencontainers.image.source=https://github.com/IVR-CBDC/Backend
          cache-from: type=gha,scope=prod-cpp-base
          cache-to: type=gha,mode=max,scope=prod-cpp-base

  images:
    needs: [plan, cpp-base]
    if: >-
      always() && !cancelled() && needs.plan.result == 'success' &&
      (needs.cpp-base.result == 'success' || needs.cpp-base.result == 'skipped') &&
      needs.plan.outputs.build_needed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ matrix.image }}
            ghcr.io/ivr-cbdc/backend/${{ matrix.service }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/IVR-CBDC/Backend
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: BASE_IMAGE=${{ needs.plan.outputs.base_image }}
          cache-from: type=gha,scope=prod-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=prod-${{ matrix.service }}

  bundle:
    needs: [plan, cpp-base, images]
    if: >-
      always() && !cancelled() && needs.plan.result == 'success' &&
      (needs.images.result == 'success' || needs.images.result == 'skipped') &&
      (needs.cpp-base.result == 'success' || needs.cpp-base.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      release_id: ${{ steps.bundle.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: image-plan
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_READ_TOKEN || secrets.GITHUB_TOKEN }}
      - id: bundle
        env:
          BACKEND_SHA: ${{ needs.plan.outputs.backend_sha }}
          FRONTEND_SHA: ${{ needs.plan.outputs.frontend_sha }}
          IMAGE_PLAN: image-plan.json
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          release_id="b${BACKEND_SHA:0:12}-f${FRONTEND_SHA:0:12}-r${RUN_ID}-a${RUN_ATTEMPT}"
          python3 deploy/production/scripts/package.py /tmp/ivr-release
          tar -C /tmp/ivr-release -czf release.tar.gz .
          sha256sum release.tar.gz > release.tar.gz.sha256
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: production-release
          path: |
            release.tar.gz
            release.tar.gz.sha256
          retention-days: 14

  deploy:
    needs: [plan, preflight, bundle]
    if: >-
      always() && !cancelled() && needs.bundle.result == 'success' &&
      needs.preflight.result == 'success' && needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: production-release
      - id: fresh
        name: Avoid deploying an obsolete snapshot while newer pushes are queued
        env:
          BACKEND_SHA: ${{ needs.plan.outputs.backend_sha }}
          FRONTEND_SHA: ${{ needs.plan.outputs.frontend_sha }}
        run: |
          set -euo pipefail
          fresh=false
          if [[ $(git ls-remote https://github.com/IVR-CBDC/Backend.git refs/heads/main | cut -f1) == "$BACKEND_SHA" && $(git ls-remote https://github.com/IVR-CBDC/Frontend.git refs/heads/main | cut -f1) == "$FRONTEND_SHA" ]]; then
            fresh=true
          fi
          echo "fresh=$fresh" >> "$GITHUB_OUTPUT"
      - name: Automatic SSH deployment
        if: steps.fresh.outputs.fresh == 'true'
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ vars.PROD_SSH_PORT || '22' }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
          RELEASE_ID: ${{ needs.bundle.outputs.release_id }}
        run: bash deploy/production/ci/ssh-deploy.sh
