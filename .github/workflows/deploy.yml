name: Deploy to K3s

on:
  push:
    branches:
      - main # Деплоим при пуше в ветку main

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Нужно для пуша в GitHub Packages

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # F8 (final review): ghcr требует lowercase в имени пакета.
      # github.repository сохраняет регистр владельца/репозитория как он
      # заведён на GitHub — сейчас он и так нижний, но это не гарантия на
      # будущее (переименование организации, форк с CamelCase-именем), а
      # чинить постфактум для уже запушенных тегов сложнее, чем один раз
      # привести явно.
      - name: Lowercase repository name for ghcr
        id: repo
        run: echo "lc=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # --- Общий базовый образ (drogon/libjwt) для auth и core ---
      # Пересобирается на каждый деплой, но благодаря cache-from/cache-to
      # type=gha это дёшево (см. Task 1/4: сама сборка drogon с нуля ~15-19
      # минут, из кэша — секунды). Пересобирать только при изменении
      # cpp-base.Dockerfile через dorny/paths-filter намеренно не стали:
      # это лишний движущийся шаг (обнаружение изменений, отдельный тег
      # образа для пропущенных случаев) ради экономии, которую и так даёт
      # кэш слоёв — а безусловная пересборка гарантирует, что ghcr всегда
      # содержит актуальный ivr-cpp-base, даже если кто-то поменяет базовый
      # Dockerfile в том же PR, где меняются и сервисы.
      #
      # F5 (final review): раньше база пушилась только как :latest, а
      # BASE_IMAGE сервисов ссылался на :latest — значит образ сервиса с
      # тегом sha через месяц пересобрался бы на другой (более новой) базе,
      # и два одновременных деплоя main дрались бы за один и тот же тег
      # :latest. Теперь база тоже получает тег :${{ github.sha }}, и именно
      # его сервисы передают в BASE_IMAGE — так тег сервиса детерминированно
      # фиксирует, с какой версией базы он собран.
      - name: Build and push ivr-cpp-base
        uses: docker/build-push-action@v5
        with:
          context: infra/docker
          file: infra/docker/cpp-base.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.lc }}/ivr-cpp-base:latest
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.lc }}/ivr-cpp-base:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Сборка и пуш Auth Service ---
      - name: Extract metadata for auth
        id: meta-auth
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.lc }}/service-auth
          tags: |
            type=sha,format=short

      - name: Build and push service-auth
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/service-auth/Dockerfile
          push: true
          tags: ${{ steps.meta-auth.outputs.tags }}
          labels: ${{ steps.meta-auth.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ steps.repo.outputs.lc }}/ivr-cpp-base:${{ github.sha }}

      # --- Сборка и пуш Core Service ---
      - name: Extract metadata for core
        id: meta-core
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.lc }}/service-core
          tags: |
            type=sha,format=short

      - name: Build and push service-core
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/service-core/Dockerfile
          push: true
          tags: ${{ steps.meta-core.outputs.tags }}
          labels: ${{ steps.meta-core.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ steps.repo.outputs.lc }}/ivr-cpp-base:${{ github.sha }}

      # --- Сборка и пуш Commission Service ---
      - name: Extract metadata for commission
        id: meta-commission
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.lc }}/service-commission
          tags: |
            type=sha,format=short

      - name: Build and push service-commission
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/service-commission/Dockerfile
          push: true
          tags: ${{ steps.meta-commission.outputs.tags }}
          labels: ${{ steps.meta-commission.outputs.labels }}

    outputs:
      tag: ${{ fromJSON(steps.meta-auth.outputs.json).labels['org.opencontainers.image.version'] }} # берем sha тег
      repo-lc: ${{ steps.repo.outputs.lc }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate migration values
        run: |
          for s in service-auth service-core service-commission; do
            bash infra/gen-migration-values.sh "$s"
          done

      # Копируем папку helm на сервер, чтобы применить свежие манифесты
      - name: Copy Helm charts to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: 27373
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "infra/helm"
          target: "~/deploy-ivr"

      - name: Deploy to k3s via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: 27373
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # Выполняем helm upgrade на сервере, передавая новые теги образов
          script: |
            export KUBECONFIG=~/.kube/config
            cd ~/deploy-ivr/infra/helm
            
            # Auth
            helm upgrade --install service-auth ./generic-service --wait --timeout 5m \
              -f values-service-auth.yaml \
              -f generated/migrations-service-auth.yaml \
              --set image.repository=${{ env.REGISTRY }}/${{ needs.build-and-push.outputs.repo-lc }}/service-auth \
              --set image.tag=${{ needs.build-and-push.outputs.tag }} \
              --set "imagePullSecrets[0].name=ghcr-secret" \
              -n backend

            # Core
            helm upgrade --install service-core ./generic-service --wait --timeout 5m \
              -f values-service-core.yaml \
              -f generated/migrations-service-core.yaml \
              --set image.repository=${{ env.REGISTRY }}/${{ needs.build-and-push.outputs.repo-lc }}/service-core \
              --set image.tag=${{ needs.build-and-push.outputs.tag }} \
              --set "imagePullSecrets[0].name=ghcr-secret" \
              -n backend

            # Commission
            helm upgrade --install service-commission ./generic-service --wait --timeout 5m \
              -f values-service-commission.yaml \
              -f generated/migrations-service-commission.yaml \
              --set image.repository=${{ env.REGISTRY }}/${{ needs.build-and-push.outputs.repo-lc }}/service-commission \
              --set image.tag=${{ needs.build-and-push.outputs.tag }} \
              --set "imagePullSecrets[0].name=ghcr-secret" \
              -n backend
