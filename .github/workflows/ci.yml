name: CI

# На каждый PR и на пуш в любую ветку кроме main (там уже есть deploy.yml,
# который собирает и катит образы — гонять полный тестовый набор ещё раз
# после мержа не нужно).
# F8 (final review): без concurrency серия пушей в одну ветку выстраивает
# очередь из 15-минутных C++-джоб — каждый новый пуш ждёт, пока отработает
# предыдущий. group завязана на ветку/PR, cancel-in-progress отменяет
# устаревший прогон при новом пуше в тот же ref.
# `push` (без main) оставили рядом с `pull_request` осознанно, а не выпилили:
# он даёт зелёную галочку на ветке ДО открытия PR (полезно при пуше в общую
# ветку без PR, или чтобы проверить состояние перед тем как его открывать).
# Из-за этого пуш в ветку с уже открытым PR из этого же репозитория
# действительно гоняет набор дважды (pull_request и push — разные ref:
# refs/pull/N/merge и refs/heads/<branch>, поэтому concurrency их не
# схлопывает в один прогон) — но concurrency решает named-в-финдинге
# проблему (очередь), а цену двойного прогона на PR из этого же репозитория
# сочли приемлемой ради быстрой обратной связи на ветках без PR.
on:
  pull_request:
  push:
    branches-ignore:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # shellcheck: только infra/*.sh — infra/docker/* это Dockerfile'ы, не
  # шелл-скрипты, им шеллчек не нужен.
  # ============================================================
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: shellcheck infra/*.sh
        run: shellcheck infra/*.sh

      # traefik.dashboard.yml — копия traefik.yml с другим блоком api:
      # (оверлей docker-compose.dashboard.yml подменяет им весь статический
      # конфиг). Связать их средствами Traefik нельзя — при --configFile он
      # игнорирует переменные окружения, include'ов у статического конфига
      # нет, — поэтому расхождение ловится здесь, а не глазами.
      - name: traefik configs in sync
        run: bash infra/check-traefik-configs.sh

  # ============================================================
  # helm (F4, final review): чарт до сих пор не проверялся ни одной джобой,
  # а infra/gen-migration-values.sh течёт в него через values — поломка
  # генератора или дрейф между сгенерированными values и infra/migrate.sh
  # обнаруживались бы только при деплое в k3s. Джоба независимая (без
  # needs): не зависит от cpp-base и не требует поднятого стенда.
  # ============================================================
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      # Список сервисов один и тот же у CI, CD и Makefile — infra/services.tsv
      # (план 08 Task 3). Раньше здесь был свой список из трёх имён, и bff с
      # frontend не проверялись ни разу: их values появились в Task 2, а
      # джоба о них не знала.
      - name: Собрать аргументы helm для каждого сервиса
        id: svc
        run: |
          set -euo pipefail
          mkdir -p ci-helm-args
          awk '!/^[[:space:]]*#/ && NF' infra/services.tsv | while read -r name build cppbase mig tagsrc pwvar; do
            args="-f infra/helm/values-${name}.yaml"
            if [ "$mig" = yes ]; then
              bash infra/gen-migration-values.sh "$name"
              args="$args -f infra/helm/generated/migrations-${name}.yaml"
            fi
            # Пароль для рендера. После Task 2 чарт падает без него намеренно
            # (fail-closed), поэтому CI обязан его передать — иначе джоба
            # проверяла бы не чарт, а работу гварда. Значение фиктивное и из
            # разрешённого набора: гвард userinfo отвергает всё, что в URL
            # требует процент-кодирования.
            if [ "$pwvar" != "-" ]; then
              args="$args --set-string secrets.data.dbPassword=ciRenderOnlyPassword0"
            fi
            printf '%s %s %s\n' "$name" "$mig" "$args" >> ci-helm-args/list
          done
          cat ci-helm-args/list

      - name: helm lint
        run: |
          set -euo pipefail
          # IFS по умолчанию: имя и флаг — первые два поля, остаток строки
          # уезжает в $args и намеренно раскрывается без кавычек.
          while read -r name mig args; do
            echo "=== helm lint $name ==="
            # shellcheck disable=SC2086
            helm lint infra/helm/generic-service $args
          done < ci-helm-args/list

      - name: helm template
        run: |
          set -euo pipefail
          # IFS по умолчанию: имя и флаг — первые два поля, остаток строки
          # уезжает в $args и намеренно раскрывается без кавычек.
          while read -r name mig args; do
            echo "=== helm template $name ==="
            # shellcheck disable=SC2086
            helm template "$name" infra/helm/generic-service $args \
              > "/tmp/${name}-rendered.yaml"
          done < ci-helm-args/list

      # Ловит ровно тот дрейф, который сейчас фактически есть в рабочем
      # дереве: infra/helm/generated/*.yaml пишет старую версию скрипта,
      # пока их никто не перегенерирует (Makefile/deploy.yml делают это
      # сами перед деплоем, но рабочее дерево может отставать). Сравниваем
      # data["migrate.sh"] отрендеренного ConfigMap с infra/migrate.sh
      # побайтово, а не просто "файл сгенерировался" — именно расхождение
      # содержимого и есть дефект, который нужно ловить.
      - name: Check rendered migrate.sh matches infra/migrate.sh byte-for-byte
        run: |
          set -euo pipefail
          cat > /tmp/check_migrate_drift.py <<'PY'
          import sys, yaml
          svc, path = sys.argv[1], sys.argv[2]
          docs = [d for d in yaml.safe_load_all(open(path)) if d]
          cm = docs[0]
          rendered = cm["data"]["migrate.sh"]
          original = open("infra/migrate.sh").read()
          if rendered != original:
              print(f"DRIFT: rendered migrate.sh for {svc} != infra/migrate.sh")
              sys.exit(1)
          print(f"OK: {svc} migrate.sh matches infra/migrate.sh byte-for-byte")
          PY
          while read -r s mig args; do
            [ "$mig" = yes ] || continue
            # shellcheck disable=SC2086
            helm template "$s" infra/helm/generic-service $args \
              --show-only templates/migrations-configmap.yaml \
              > "/tmp/${s}-migrations-cm.yaml"
            python3 /tmp/check_migrate_drift.py "$s" "/tmp/${s}-migrations-cm.yaml"
          done < ci-helm-args/list

  # ============================================================
  # cpp: собирает ivr-cpp-base (с кэшем GHA) и внутри него гоняет workspace-
  # сборку с Catch2-тестами (FetchContent тянет Catch2 по сети при
  # конфигурации — сеть контейнеру доступна по умолчанию).
  # ============================================================
  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ivr-cpp-base (cached)
        uses: docker/build-push-action@v5
        with:
          context: infra/docker
          file: infra/docker/cpp-base.Dockerfile
          tags: ivr-cpp-base:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure, build, test (Catch2)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/workspace -w /workspace \
            ivr-cpp-base:latest \
            bash -c '
              set -euo pipefail
              # python3 + python3-cryptography нужны только infra/gen-keys.sh
              # (CMakeLists дергает его для тестовых JWT-ключей при
              # BUILD_TESTS=ON) — в самом образе их нет (см. Task 1: там
              # только build-зависимости drogon/libjwt). Ставим их здесь, а
              # не добавляем в cpp-base.Dockerfile: там всего один apt-слой,
              # и любое изменение его команды инвалидирует кэш GHA для всего,
              # что после него (git clone + сборка drogon, ~15 минут) — ради
              # двух пакетов, нужных только тестам, а не рантайму сервисов.
              apt-get update
              apt-get install -y --no-install-recommends python3 python3-cryptography
              rm -rf /var/lib/apt/lists/*
              cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTS=ON
              cmake --build build -j"$(nproc)"
              ctest --test-dir build --output-on-failure
            '

  # ============================================================
  # commission: юнит-тесты без БД, затем — с реальным postgres как
  # service-контейнером джобы (миграции применяются тем же infra/migrate.sh,
  # что и в compose/helm — один источник правды).
  # ============================================================
  commission:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: commission
          POSTGRES_PASSWORD: commission
          POSTGRES_DB: commission
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U commission"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: uv sync (dev group)
        working-directory: services/service-commission
        run: uv sync --locked --group dev

      - name: pytest -m "not db"
        working-directory: services/service-commission
        run: uv run pytest -q -m "not db"

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply migrations to service postgres
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: commission
          DB_USER: commission
          DB_PASSWORD: commission
        run: bash infra/migrate.sh services/service-commission/migrations

      - name: pytest -m db
        working-directory: services/service-commission
        env:
          TEST_PG_DSN: postgresql+asyncpg://commission:commission@localhost:5432/commission
        run: uv run pytest -q -m db

  # ============================================================
  # api: полный стенд (auth/core/commission + их БД + redis) через
  # docker-compose.yml + docker-compose.dev.yml (host-порты для tests/api),
  # EMULATOR_MANUAL=true — как make test-api. Единственная джоба с needs:
  # ей нужен собранный (и уже закэшированный в GHA джобой cpp) ivr-cpp-base.
  # ============================================================
  api:
    runs-on: ubuntu-latest
    needs: cpp
    steps:
      - uses: actions/checkout@v4

      # infra/gen-keys.sh конвертирует PEM -> JWK через python3+cryptography
      # (см. тот же комментарий в джобе cpp) — на голом ubuntu-latest раннере
      # это не гарантировано (GitHub не обещает cryptography в системном
      # python3), поэтому ставим явно перед вызовом скрипта.
      - name: Install python3 + cryptography (for gen-keys.sh)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3 python3-cryptography

      - name: Generate JWT keys
        run: bash infra/gen-keys.sh

      - uses: docker/setup-buildx-action@v3

      - name: Restore ivr-cpp-base from GHA cache
        uses: docker/build-push-action@v5
        with:
          context: infra/docker
          file: infra/docker/cpp-base.Dockerfile
          tags: ivr-cpp-base:latest
          load: true
          cache-from: type=gha

      # F1 (final review): docker/setup-buildx-action делает текущим билдер с
      # драйвером docker-container, а `docker compose build` строит через
      # buildx (через текущий билдер). Container-драйвер собирает в отдельном
      # контейнере и НЕ видит image store демона — значит `FROM ${BASE_IMAGE}`
      # (ivr-cpp-base:latest, только что загруженный в демон шагом выше через
      # load: true) резолвится как попытка спуллить с registry и падает
      # pull access denied. BUILDX_BUILDER=default возвращает этот конкретный
      # шаг на classic docker-драйвер, который строит через тот же демон и
      # видит его image store — сам билдер, созданный setup-buildx-action,
      # при этом не трогаем (env переопределяет билдер только для команд
      # внутри этого шага, не меняет `docker buildx use` глобально).
      - name: Bring up stack (EMULATOR_MANUAL=true)
        env:
          BUILDX_BUILDER: default
        run: |
          EMULATOR_MANUAL=true docker compose \
            -f docker-compose.yml -f docker-compose.dev.yml \
            up -d --build --wait \
            pg-auth migrate-auth service-auth \
            pg-core migrate-core service-core \
            pg-commission migrate-commission service-commission redis

      # F2 (final review): tests/api/conftest.py вызывает psql (проверка
      # outbox) — на ubuntu-latest он сейчас есть предустановленным, но это
      # недекларированная зависимость от состава образа раннера. Ставим явно,
      # симметрично джобе commission.
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # F6 (final review): дешёвый smoke на дрейф версий Debian между
      # infra/docker/cpp-base.Dockerfile и runtime-стадиями сервисных
      # Dockerfile — если soname разъехались, ldd покажет "not found" вместо
      # падения только в рантайме на реальном трафике.
      - name: ldd smoke (no "not found" against runtime libs)
        run: |
          set -euo pipefail
          for pair in "service-auth:service_auth" "service-core:service_core"; do
            svc="${pair%%:*}"; bin="${pair##*:}"
            echo "=== ldd /usr/local/bin/${bin} (${svc}) ==="
            out=$(docker compose -f docker-compose.yml -f docker-compose.dev.yml \
              exec -T "${svc}" ldd "/usr/local/bin/${bin}")
            echo "$out"
            if echo "$out" | grep -q "not found"; then
              echo "::error::${svc}: ${bin} has unresolved shared libraries (Debian version drift between cpp-base and runtime stage?)"
              exit 1
            fi
          done

      - uses: astral-sh/setup-uv@v5

      - name: pytest tests/api
        working-directory: tests/api
        run: uv run pytest -q

      - name: Dump compose logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml logs \
            > /tmp/compose-logs.txt 2>&1 || true

      - name: Upload compose logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-compose-logs
          path: /tmp/compose-logs.txt
