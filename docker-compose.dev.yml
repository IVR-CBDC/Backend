# Dev-оверлей: пробрасывает наружу порты сервисов и БД для ручной отладки и
# для тестов, которые ходят в стенд с хоста (tests/api, service-commission
# db-тесты). Обычный `make up` (без этого файла) наружу отдаёт только
# traefik — так продовая топология (единая точка входа) не расходится
# с тем, что открыто на dev-машине.
#
# Использование: docker compose -f docker-compose.yml -f docker-compose.dev.yml up ...
# (см. `make test-api`, `make test-commission-db`).

services:
  pg-auth:
    ports:
      - "127.0.0.1:5433:5432"   # для ручной отладки и api-тестов

  pg-core:
    ports:
      - "127.0.0.1:5435:5432"   # для api-тестов и ручной отладки

  pg-commission:
    ports:
      - "127.0.0.1:5434:5432"   # для локальных db-тестов

  service-auth:
    ports:
      - "127.0.0.1:18080:8080"   # для tests/api (make test-api)

  service-core:
    ports:
      - "127.0.0.1:18081:8080"   # для tests/api (make test-api)

  bff:
    ports:
      - "127.0.0.1:14000:4000"   # для ручной проверки /health и /api/* с хоста
    environment:
      # ПОПРАВКА (план 08, Task 4): утверждение F14 «compose ЗАМЕНЯЕТ
      # значение ключа environment целиком» неверно. `environment`, заданный
      # мэппингом, сливается ПО КЛЮЧАМ: ключи базы, которых нет в оверлее,
      # сохраняются (проверено `docker compose -f docker-compose.yml -f
      # docker-compose.dev.yml config` — у bff здесь виден весь набор
      # AUTH_URL/CORE_URL/REDIS_URL, хотя ниже перечислен только
      # ALLOWED_ORIGINS). Если бы замена была настоящей, bff в dev-стенде
      # остался бы вообще без апстримов и не поднимался бы ни разу — а он
      # поднимается. Строка ниже поэтому не «повтор дефолта ради выживания
      # остальных ключей», а обычное переопределение одного ключа: дефолт
      # повторён, чтобы к нему добавился origin dev-порта.
      #
      # origin браузера при заходе на SPA через host-порт
      # dev-оверлея (127.0.0.1:8090) иначе не пройдёт проверку CSRF на
      # мутирующих запросах (см. README «Контракт для SPA»,
      # FORBIDDEN_ORIGIN) — без этого сквозной сценарий из браузера (Step 3
      # плана 06) не пройти.
      #
      # F6 (план 07, final review): раньше значение было захардкожено
      # литералом — docker-compose.yml параметризует его через
      # `${ALLOWED_ORIGINS:-...}` с комментарием «план 08 задаст через env»,
      # но e2e-стенд всегда поднимается с этим dev-оверлеем (см.
      # `make e2e-stand-up`), а он полностью заменяет ключ `environment`, а
      # не дополняет — то есть рычаг для плана 08 был мёртв именно там, где
      # нужен. Тот же паттерн `${ALLOWED_ORIGINS:-...}` здесь, тот же дефолт.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost,http://127.0.0.1:8090}

  frontend:
    ports:
      # F11 (final review): образ SPA перешёл на nginxinc/nginx-unprivileged
      # (Frontend-репозиторий, frontend/Dockerfile) — слушает 8080.
      - "127.0.0.1:8090:8080"   # для ручной проверки SPA в браузере с хоста
