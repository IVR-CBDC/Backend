# Dev-оверлей: пробрасывает наружу порты сервисов и БД для ручной отладки и
# для тестов, которые ходят в стенд с хоста (tests/api, service-commission
# db-тесты). Обычный `make up` (без этого файла) наружу отдаёт только
# traefik — так продовая топология (единая точка входа) не расходится
# с тем, что открыто на dev-машине.
#
# Использование: docker compose -f docker-compose.yml -f docker-compose.dev.yml up ...
# (см. `make test-api`, `make test-commission-db`).

services:
  pg-auth:
    ports:
      - "127.0.0.1:5433:5432"   # для ручной отладки и api-тестов

  pg-core:
    ports:
      - "127.0.0.1:5435:5432"   # для api-тестов и ручной отладки

  pg-commission:
    ports:
      - "127.0.0.1:5434:5432"   # для локальных db-тестов

  service-auth:
    ports:
      - "127.0.0.1:18080:8080"   # для tests/api (make test-api)

  service-core:
    ports:
      - "127.0.0.1:18081:8080"   # для tests/api (make test-api)

  bff:
    ports:
      - "127.0.0.1:14000:4000"   # для ручной проверки /health и /api/* с хоста
    environment:
      # F14 (final review): compose ЗАМЕНЯЕТ значение ключа environment
      # целиком, а не дополняет его — этот список здесь поэтому повторяет
      # дефолт из docker-compose.yml (ALLOWED_ORIGINS) плюс добавляет свой
      # origin. origin браузера при заходе на SPA через host-порт
      # dev-оверлея (127.0.0.1:8090) иначе не пройдёт проверку CSRF на
      # мутирующих запросах (см. README «Контракт для SPA»,
      # FORBIDDEN_ORIGIN) — без этого сквозной сценарий из браузера (Step 3
      # плана 06) не пройти.
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost,http://127.0.0.1:8090

  frontend:
    ports:
      # F11 (final review): образ SPA перешёл на nginxinc/nginx-unprivileged
      # (Frontend-репозиторий, frontend/Dockerfile) — слушает 8080.
      - "127.0.0.1:8090:8080"   # для ручной проверки SPA в браузере с хоста
