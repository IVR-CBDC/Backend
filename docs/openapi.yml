openapi: "3.0.3"
info:
  title: IVR Backend API
  version: "0.1.0"
  description: "-"

servers:
  - url: http://localhost
    description: Local

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

paths:
  /api/auth/register:
    post:
      summary: "Регистрация нового пользователя"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                login:
                  type: string
                password:
                  type: string
                name:
                  type: string
                company_name:
                  type: string
                inn:
                  type: string
              required:
                - login
                - password
                - company_name
                - inn
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: string
                  company_id:
                    type: string
                  token:
                    type: string
                required:
                  - user_id
                  - company_id
                  - token
        "400":
          description: "Bad Request"
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  error:
                    type: string
                required:
                  - code
                  - error
        "409":
          description: "Conflict"
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  error:
                    type: string
                required:
                  - code
                  - error

  /api/auth/login:
    post:
      summary: "Авторизация, возвращает JWT"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                login:
                  type: string
                password:
                  type: string
              required:
                - login
                - password
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: string
                  company_id:
                    type: string
                  token:
                    type: string
                required:
                  - user_id
                  - company_id
                  - token
        "400":
          description: "Bad Request"
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  error:
                    type: string
                required:
                  - code
                  - error
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  error:
                    type: string
                required:
                  - code
                  - error

  /api/auth/me:
    get:
      summary: "Профиль текущего пользователя и его компания"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: string
                  login:
                    type: string
                  name:
                    type: string
                  company:
                    type: object
                required:
                  - user_id
                  - login
                  - name
                  - company
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  error:
                    type: string
                required:
                  - code
                  - error

  /health:
    get:
      summary: "Health check service-auth"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  service:
                    type: string
                  version:
                    type: string
                required:
                  - ok
                  - service
                  - version

  /api/core/deals:
    get:
      summary: "Список сделок компании"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                  count:
                    type: integer
                required:
                  - items
                  - count
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  error:
                    type: string
                required:
                  - code
                  - error

    post:
      summary: "Создание сделки"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                counterparty_country:
                  type: string
                counterparty_name:
                  type: string
                operation_type:
                  type: string
                amount:
                  type: number
                currency:
                  type: string
              required:
                - counterparty_country
                - counterparty_name
                - operation_type
                - amount
                - currency
      responses:
        "201":
          description: "OK"
          content:
            application/json:
              schema:
                type: object
                properties:
                  deal:
                    type: object
                required:
                  - deal
        "400":
          description: "Bad Request"
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  error:
                    type: string
                required:
                  - code
                  - error

  /api/core/deals/{id}:
    get:
      summary: "Сделка целиком: документы и таймлайн"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: object
                properties:
                  deal:
                    type: object
                required:
                  - deal
        "404":
          description: "Not Found"
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  error:
                    type: string
                required:
                  - code
                  - error

  /api/core/deals/{id}/scenario:
    post:
      summary: "Подтверждение сценария расчёта (комиссия пересчитывается на сервере)"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scenario:
                  type: string
                version:
                  type: integer
              required:
                - scenario
                - version
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: object
                properties:
                  deal:
                    type: object
                required:
                  - deal
        "409":
          description: "Conflict"
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  error:
                    type: string
                required:
                  - code
                  - error

  /api/core/deals/{dealId}/documents/{docId}/submit:
    post:
      summary: "Подача документа на проверку"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                version:
                  type: integer
              required:
                - version
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: object
                properties:
                  deal:
                    type: object
                required:
                  - deal
        "409":
          description: "Conflict"
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  error:
                    type: string
                required:
                  - code
                  - error

  /api/core/notifications:
    get:
      summary: "Список уведомлений компании"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                  unread:
                    type: integer
                required:
                  - items
                  - unread
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  error:
                    type: string
                required:
                  - code
                  - error

  /api/core/notifications/{id}/read:
    post:
      summary: "Отметить уведомление прочитанным"
      security:
        - bearerAuth: []
      responses:
        "404":
          description: "Not Found"
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  error:
                    type: string
                required:
                  - code
                  - error

  /api/commission/calculate:
    post:
      summary: "Комиссия по коридору (совместимо с ivrpy)"
      responses:
        "200":
          description: "Successful Response"
          content:
            application/json:
              schema:
                type: object
        "422":
          description: "Validation Error"
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: array

  /api/commission/quotes:
    post:
      summary: "Котировки по всем сценариям расчёта"
      responses:
        "200":
          description: "Successful Response"
          content:
            application/json:
              schema:
                type: object
        "422":
          description: "Validation Error"
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: array
